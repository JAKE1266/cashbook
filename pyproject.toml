[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cashbook"
version = "1.0.1"
description = "CashBook 轻记账 —— 零依赖的命令行记账本:记账 / 月度报表 / 分类图表 / 预算预警 / CSV 导出"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JAKE1266" }]
keywords = ["accounting", "ledger", "expense-tracker", "cli", "budget", "money"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/JAKE1266/cashbook"
Issues = "https://github.com/JAKE1266/cashbook/issues"

[project.scripts]
cashbook = "cashbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
